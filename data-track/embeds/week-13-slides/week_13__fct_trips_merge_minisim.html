<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERGE mini-sim: first run → incremental → full refresh</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 10px;
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #c9d1d9;
  }
  .wrap {
    width: 100%;
    max-width: 980px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 16px 36px rgba(0,0,0,0.6);
  }
  .titlebar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 14px; background: #0d1117; border-bottom: 1px solid #21262d;
  }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.r { background: #ff5f56; } .dot.y { background: #ffbd2e; } .dot.g { background: #27c93f; }
  .title { font-family: 'SF Mono', Menlo, monospace; font-size: 12px; color: #8b949e; margin-right: auto; }

  .controls {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid #21262d; background: #0d1117;
  }
  .controls button {
    appearance: none; border: 1px solid #30363d; background: #21262d; color: #f0f6fc;
    font: inherit; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 8px; cursor: pointer;
  }
  .controls button:hover { border-color: #58a6ff; }
  .controls button:disabled { opacity: 0.4; cursor: default; }
  .controls button.primary { background: #1f6feb; border-color: #1f6feb; }
  .step-pill {
    font-family: 'SF Mono', Menlo, monospace; font-size: 12px; color: #8b949e; margin-left: auto;
  }

  .stage {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px;
    padding: 14px; align-items: start;
  }
  @media (max-width: 720px) { .stage { grid-template-columns: 1fr; } .flow-arrow { transform: rotate(90deg); padding-top: 0; } }

  .panel {
    background: #0d1117; border: 1px solid #30363d; border-radius: 8px; overflow: hidden;
  }
  .panel h3 {
    font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #8b949e;
    padding: 8px 12px; border-bottom: 1px solid #21262d; background: #161b22;
  }
  table { width: 100%; border-collapse: collapse; font-family: 'SF Mono', Menlo, monospace; font-size: 11px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #21262d; vertical-align: middle; }
  th { color: #8b949e; font-weight: 600; }
  td.id { color: #79c0ff; white-space: nowrap; }
  tr.row { transition: background 0.2s ease, outline 0.2s ease; }
  tr.match { background: rgba(255, 166, 87, 0.16); outline: 1px solid rgba(255,166,87,0.45); }
  tr.insert { background: rgba(63, 185, 80, 0.16); outline: 1px solid rgba(63,185,80,0.45); }
  tr.refresh { background: rgba(88, 166, 255, 0.14); outline: 1px solid rgba(88,166,255,0.4); }
  tr.dim { opacity: 0.35; }
  .tag {
    display: inline-block; font-size: 10px; font-weight: 700; text-transform: uppercase;
    padding: 1px 6px; border-radius: 999px; margin-left: 6px; vertical-align: middle;
  }
  .tag.match { color: #ffa657; background: rgba(255,166,87,0.15); }
  .tag.insert { color: #3fb950; background: rgba(63,185,80,0.15); }
  .tag.refresh { color: #58a6ff; background: rgba(88,166,255,0.15); }
  .fare-change {
    display: inline-flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    line-height: 1;
  }
  .fare-change .old {
    color: #8b949e;
    text-decoration: line-through;
    font-weight: 600;
  }
  .fare-change .fare-arrow {
    color: #ffa657;
    font-size: 13px;
    line-height: 1;
  }
  .fare-change .new {
    color: #ffa657;
    font-weight: 700;
  }

  .flow-arrow {
    align-self: center; color: #58a6ff; font-size: 22px; font-weight: 700; padding-top: 28px;
  }

  .legend {
    display: flex; gap: 14px; flex-wrap: wrap; padding: 0 14px 10px;
    font-size: 12px; color: #8b949e;
  }
  .legend span::before {
    content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
    margin-right: 6px; vertical-align: -1px;
  }
  .legend .l-match::before { background: #ffa657; }
  .legend .l-insert::before { background: #3fb950; }
  .legend .l-refresh::before { background: #58a6ff; }

  .dock {
    border-top: 1px solid #30363d; padding: 12px 16px; background: #161b22; min-height: 78px;
  }
  .dock-kicker {
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: #8b949e; margin-bottom: 4px;
  }
  .dock-body { font-size: 13px; line-height: 1.45; color: #f0f6fc; }
  .dock-body strong { color: #ffa657; }
  .dock-body code {
    font-family: 'SF Mono', Menlo, monospace; font-size: 12px;
    background: #0d1117; padding: 1px 5px; border-radius: 4px; color: #79c0ff;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="titlebar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">MERGE mini-sim · unique_key = trip_id</span>
    </div>

    <div class="controls">
      <button type="button" id="btn-prev" disabled>← Back</button>
      <button type="button" id="btn-next" class="primary">Next →</button>
      <button type="button" id="btn-reset">Reset</button>
      <span class="step-pill" id="step-pill">Step 1 / 4</span>
    </div>

    <div class="stage">
      <div class="panel">
        <h3>Incoming batch</h3>
        <table>
          <thead><tr><th>trip_id</th><th>pickup_datetime</th><th>fare_amount</th></tr></thead>
          <tbody id="incoming"></tbody>
        </table>
      </div>
      <div class="flow-arrow" aria-hidden="true">⟶</div>
      <div class="panel">
        <h3>fct_trips ({{ this }})</h3>
        <table>
          <thead><tr><th>trip_id</th><th>pickup_datetime</th><th>fare_amount</th></tr></thead>
          <tbody id="target"></tbody>
        </table>
      </div>
    </div>

    <div class="legend">
      <span class="l-match">MATCH → update</span>
      <span class="l-insert">NO MATCH → insert</span>
      <span class="l-refresh">full-refresh → rebuild</span>
    </div>

    <div class="dock">
      <div class="dock-kicker">Key takeaway</div>
      <div class="dock-body" id="say"></div>
    </div>
  </div>

  <script>
    const incomingEl = document.getElementById('incoming');
    const targetEl = document.getElementById('target');
    const sayEl = document.getElementById('say');
    const stepPill = document.getElementById('step-pill');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnReset = document.getElementById('btn-reset');

    // Short real-looking trip_ids from fct_trips (kept short for the slide).
    const ID_A = 'bbc1a108…';
    const ID_B = 'b4f8c8e1…';
    const ID_C = '05c289b8…';
    const ID_D = 'a883d300…';

    const firstBatch = [
      { id: ID_A, pickup: '2023-01-15 14:30:00', fare: '12.1' },
      { id: ID_B, pickup: '2023-01-15 14:30:02', fare: '29.6' },
      { id: ID_C, pickup: '2023-01-15 14:30:03', fare: '15.6' },
    ];
    const afterFirst = firstBatch.slice();
    const changeBatch = [
      { id: ID_C, pickup: '2023-01-15 14:30:03', fare: '16.5' }, // existing → update fare
      { id: ID_D, pickup: '2023-01-15 14:30:11', fare: '43.6' }, // new → insert
    ];
    const afterChange = [
      { id: ID_A, pickup: '2023-01-15 14:30:00', fare: '12.1' },
      { id: ID_B, pickup: '2023-01-15 14:30:02', fare: '29.6' },
      { id: ID_C, pickup: '2023-01-15 14:30:03', fare: '16.5' },
      { id: ID_D, pickup: '2023-01-15 14:30:11', fare: '43.6' },
    ];

    const steps = [
      {
        title: '1a. First run: before',
        incoming: firstBatch,
        target: [],
        marks: {
          incoming: { [ID_A]: 'insert', [ID_B]: 'insert', [ID_C]: 'insert' },
        },
        emptyTarget: '(empty — table does not exist yet)',
        say: '<code>fct_trips</code> does not exist yet, so <code>is_incremental()</code> is <strong>false</strong>. Three rows wait on the left. Next: they load into the empty table.'
      },
      {
        title: '1b. First run: loaded',
        incoming: firstBatch,
        target: afterFirst,
        dimIncoming: true,
        marks: {
          target: { [ID_A]: 'insert', [ID_B]: 'insert', [ID_C]: 'insert' },
        },
        say: 'Load finished. All three rows are now in <code>fct_trips</code>. First run = full select + create the table.'
      },
      {
        title: '2a. Incremental: no new rows',
        incoming: [],
        target: afterFirst,
        marks: {},
        say: 'Second <code>dbt build</code>. <code>is_incremental()</code> is <strong>true</strong>. Watermark finds <strong>0</strong> newer trips, so the incoming batch is empty.'
      },
      {
        title: '2b. Incremental: nothing to load',
        incoming: [],
        target: afterFirst,
        marks: {},
        say: 'Nothing moves left → right. <code>fct_trips</code> is unchanged. That is why this run is fast.'
      },
      {
        title: '3a. Incremental: batch arrives',
        incoming: changeBatch,
        target: afterFirst,
        marks: {
          incoming: { [ID_C]: 'match', [ID_D]: 'insert' },
        },
        say: 'New batch: same <code>trip_id</code> with a new fare (update), plus a brand-new <code>trip_id</code> (insert). Right side still has the old fare for <code>05c289b8…</code>.'
      },
      {
        title: '3b. Incremental: MERGE applied',
        incoming: changeBatch,
        target: afterChange,
        dimIncoming: true,
        dimUnmarkedTarget: true,
        marks: {
          incoming: { [ID_C]: 'match', [ID_D]: 'insert' },
          target: { [ID_C]: 'match', [ID_D]: 'insert' },
        },
        fareChange: { [ID_C]: { from: '15.6', to: '16.5' } },
        say: 'MERGE finished. Fare updated <strong>15.6 → 16.5</strong> on the matching key; new trip inserted. Untouched rows stay as they were.'
      },
      {
        title: '4a. Full refresh: drop',
        incoming: afterChange,
        target: [],
        marks: {
          incoming: { [ID_A]: 'refresh', [ID_B]: 'refresh', [ID_C]: 'refresh', [ID_D]: 'refresh' },
        },
        emptyTarget: '(dropped — --full-refresh)',
        say: '<code>dbt build --full-refresh</code> ignores incremental. First it clears <code>fct_trips</code>. Incoming is the full select again.'
      },
      {
        title: '4b. Full refresh: rebuild',
        incoming: afterChange,
        target: afterChange,
        dimIncoming: true,
        marks: {
          target: { [ID_A]: 'refresh', [ID_B]: 'refresh', [ID_C]: 'refresh', [ID_D]: 'refresh' },
        },
        say: 'Table rebuilt from scratch (like Week 10 <code>table</code>). Use when model logic changed or you need a clean slate.'
      }
    ];

    let step = 0;

    function fareCell(r, fareChange) {
      const ch = fareChange && fareChange[r.id];
      if (!ch) return r.fare;
      return `<span class="fare-change"><span class="old">${ch.from}</span><span class="fare-arrow" aria-hidden="true">→</span><span class="new">${ch.to}</span></span>`;
    }

    function renderRows(el, rows, markMap, emptyLabel, dimAll, fareChange, dimUnmarked) {
      el.innerHTML = '';
      if (!rows.length) {
        el.innerHTML = `<tr class="dim"><td colspan="3">${emptyLabel || '(no rows this run)'}</td></tr>`;
        return;
      }
      for (const r of rows) {
        const mark = (markMap && markMap[r.id]) || '';
        const tr = document.createElement('tr');
        const dim = dimAll || (dimUnmarked && !mark);
        tr.className = 'row' + (mark ? ' ' + mark : '') + (dim ? ' dim' : '');
        const tag = mark ? `<span class="tag ${mark}">${mark}</span>` : '';
        tr.innerHTML = `<td class="id">${r.id}${tag}</td><td>${r.pickup}</td><td>${fareCell(r, fareChange)}</td>`;
        el.appendChild(tr);
      }
    }

    function render() {
      const s = steps[step];
      renderRows(incomingEl, s.incoming, s.marks.incoming || {}, '(no rows this run)', !!s.dimIncoming);
      renderRows(
        targetEl,
        s.target,
        s.marks.target || {},
        s.emptyTarget || '(no rows this run)',
        false,
        s.fareChange,
        !!s.dimUnmarkedTarget
      );
      sayEl.innerHTML = s.say;
      stepPill.textContent = `Step ${step + 1} / ${steps.length} · ${s.title}`;
      btnPrev.disabled = step === 0;
      btnNext.disabled = step === steps.length - 1;
      btnNext.textContent = step === steps.length - 1 ? 'Done' : 'Next →';
    }

    btnPrev.addEventListener('click', () => { if (step > 0) { step--; render(); } });
    btnNext.addEventListener('click', () => { if (step < steps.length - 1) { step++; render(); } });
    btnReset.addEventListener('click', () => { step = 0; render(); });
    render();
  </script>
</body>
</html>
